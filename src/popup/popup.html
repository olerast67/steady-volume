<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" width="24" height="24" alt="">
    <h1 data-i18n="extShortName"></h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <main id="controls">
    <section>
      <div class="row">
        <label for="volume" data-i18n="volume"></label>
        <output id="volumeOut" for="volume"></output>
      </div>
      <input type="range" id="volume" min="100" max="600" step="10" list="volumeMarks">
      <datalist id="volumeMarks">
        <option value="100"></option><option value="200"></option><option value="300"></option>
        <option value="400"></option><option value="500"></option><option value="600"></option>
      </datalist>
    </section>

    <section>
      <div class="row"><span data-i18n="leveling"></span><span class="badge" id="customBadge" data-i18n="levelCustom" hidden></span></div>
      <div class="segmented" role="radiogroup" id="leveling">
        <button type="button" role="radio" data-value="0" data-i18n="levelOff"></button>
        <button type="button" role="radio" data-value="1" data-i18n="levelLight"></button>
        <button type="button" role="radio" data-value="2" data-i18n="levelAuto"></button>
        <button type="button" role="radio" data-value="3" data-i18n="levelNight"></button>
      </div>
      <p class="hint" id="levelHint"></p>

      <details id="advanced">
        <summary data-i18n="advanced"></summary>
        <div id="fields"></div>
        <button type="button" id="reset" class="link" data-i18n="reset"></button>
      </details>
    </section>

    <section class="toggles">
      <label class="toggle">
        <span><span data-i18n="dialog"></span><small data-i18n="dialogHint"></small></span>
        <span class="switch"><input type="checkbox" id="dialog"><span></span></span>
      </label>
      <label class="toggle">
        <span><span data-i18n="site"></span><small id="host"></small></span>
        <span class="switch"><input type="checkbox" id="site"><span></span></span>
      </label>
    </section>
  </main>

  <footer>
    <div id="meter" hidden><div id="meterBar"></div></div>
    <p id="status"></p>
    <button type="button" id="capture" class="link" hidden></button>
    <p class="hint" data-i18n="statusReload"></p>
    <div class="credits">
      <span><span data-i18n="author"></span> <a href="https://olerast.com" target="_blank" rel="noopener">olerast.com</a></span>
      <a class="github" href="https://github.com/olerast67/steady-volume" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </div>
    <nav>
      <a href="https://github.com/olerast67/steady-volume#readme" target="_blank" rel="noopener" data-i18n="help"></a>
      <a href="https://github.com/olerast67/steady-volume/blob/main/DONATE.md" target="_blank" rel="noopener" data-i18n="donate"></a>
      <a href="https://github.com/olerast67/steady-volume/issues/new/choose" target="_blank" rel="noopener" data-i18n="report"></a>
    </nav>
  </footer>
  <script src="../engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
